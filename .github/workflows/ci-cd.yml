name: CI/CD

on:
  push:
    branches:
      - master
      - develop
      - 'ft/**'
      - 'rl/**'
  pull_request:
    types: [opened, synchronize, reopened]

# ── Resolve environment and function-app name ─────────────────────────────────
# GitHub Actions does not support dynamic job-level `environment:` from a prior
# job output when the target is a protected environment (the name must be a
# literal string or an expression resolvable at workflow parse time for
# environment protection rules). We therefore set it via a reusable output and
# consume it in subsequent jobs while still gating secrets correctly.
jobs:
  # ── 1. Resolve environment & naming ────────────────────────────────────────
  resolve-env:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      function-app-name: ${{ steps.name.outputs.function-app-name }}
    steps:
      - name: Determine target environment
        id: env
        run: |
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "master" ]]; then
            echo "environment=pre-production" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == rl* ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=non-production" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine function app name
        id: name
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "function-app-name=pr${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "function-app-name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Build, unit-test, local integration test ────────────────────────────
  build:
    name: Build & test
    runs-on: ubuntu-latest
    needs: resolve-env

    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017

    env:
      # Local-environment values (mirrors environments/local.yml)
      MATH_DOJO_ENV_NAME: local
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017
      SPRING_DATA_MONGODB_DATABASE: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Build & unit test
        run: |
          ./mvnw --no-transfer-progress \
            -DfunctionAppName=user-account-service-${{ needs.resolve-env.outputs.function-app-name }} \
            clean package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: working-dir
          path: .
          retention-days: 1

      - name: Install Azure Functions Core Tools v3
        run: npm install -g azure-functions-core-tools@3 --unsafe-perm true

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run local integration tests
        working-directory: integration-tests
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017
          SPRING_DATA_MONGODB_DATABASE: test
        run: |
          npm run pretest
          npm run local:test

  # ── 3. Deploy to Azure Functions ───────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [resolve-env, build]
    environment: ${{ needs.resolve-env.outputs.environment }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: working-dir
          path: .

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Write Maven settings.xml (SP credentials)
        env:
          AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZ_KEY: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          mkdir -p .mvn
          cat > .mvn/settings.xml << EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>azure-auth</id>
                <configuration>
                  <client>$AZ_CLIENT</client>
                  <tenant>$AZ_TENANT</tenant>
                  <key>$AZ_KEY</key>
                  <environment>AZURE</environment>
                </configuration>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy Azure Function
        run: |
          ./mvnw --settings .mvn/settings.xml --no-transfer-progress \
            -DfunctionAppName=user-account-service-${{ needs.resolve-env.outputs.function-app-name }} \
            -DfunctionResourceGroup=${{ vars.AZURE_RESOURCE_GROUP }} \
            -DsubscriptionId=${{ vars.AZURE_SUBSCRIPTION_ID }} \
            azure-functions:deploy

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Set App Insights key
        run: |
          az functionapp config appsettings set \
            --name "user-account-service-${{ needs.resolve-env.outputs.function-app-name }}" \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --settings \
              "APPINSIGHTS_INSTRUMENTATIONKEY=${{ vars.APPINSIGHTS_INSTRUMENTATIONKEY }}" \
              "APPLICATIONINSIGHTS_CONNECTION_STRING=InstrumentationKey=${{ vars.APPINSIGHTS_INSTRUMENTATIONKEY }}"

  # ── 4. Configure app settings ───────────────────────────────────────────────
  configure:
    name: Configure app settings
    runs-on: ubuntu-latest
    needs: [resolve-env, deploy]
    environment: ${{ needs.resolve-env.outputs.environment }}

    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Set app configuration
        run: |
          az functionapp config appsettings set \
            --name "user-account-service-${{ needs.resolve-env.outputs.function-app-name }}" \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --settings \
              "SPRING_DATA_MONGODB_URI=${{ secrets.MONGODB_URI }}" \
              "MATH_DOJO_ENV_NAME=${{ vars.MATH_DOJO_ENV_NAME }}" \
              "MATH_DOJO_HTTP_REQUEST_SIGNATURE_EXPECTED_KEYID=${{ vars.MATH_DOJO_HTTP_REQUEST_SIGNATURE_EXPECTED_KEYID }}" \
              "MATH_DOJO_HTTP_REQUEST_SIGNATURE_B64_DER_PUBLIC_KEY=${{ vars.MATH_DOJO_HTTP_REQUEST_SIGNATURE_B64_DER_PUBLIC_KEY }}" \
              "SPRING_DATA_MONGODB_DATABASE=${{ vars.SPRING_DATA_MONGODB_DATABASE }}" \
            > /dev/null  # suppress output to avoid leaking values in logs

  # ── 5. Remote integration tests (PRs only) ─────────────────────────────────
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [resolve-env, configure]
    if: github.event_name == 'pull_request'
    environment: ${{ needs.resolve-env.outputs.environment }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: working-dir
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run remote integration tests
        working-directory: integration-tests
        run: |
          npm run pretest
          npm test -- --world-parameters \
            '{"baseFunctionUri":"https://mathdojoio.cloud.tyk.io/user-account-service-np-test/api","apiKey":"","xApiVersion":"${{ needs.resolve-env.outputs.function-app-name }}"}'


